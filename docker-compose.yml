services:
  postgres:
    image: postgres:16-alpine
    container_name: chowk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chowk
      POSTGRES_PASSWORD: chowk
      POSTGRES_DB: chowk
    # Host 5434 on purpose: 5432 and 5433 are commonly taken by local postgres installs.
    ports:
      - "5434:5432"
    volumes:
      - chowk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chowk -d chowk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chowk-pgdata:
