name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    # The integration tests need real rows, so CI gets a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5434/atlas
      JWT_SECRET: ci-secret-that-is-long-enough-for-the-schema
      COOKIE_SECRET: ci-cookie-secret-that-is-long-enough-too
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @atlas/database exec prisma migrate deploy

      - name: Seed
        run: pnpm db:seed
        env:
          NODE_ENV: development # the seed refuses to run against production

      - name: Check the seed is usable
        run: pnpm db:seed:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Facet assertions
        run: pnpm facets:check

      - run: pnpm build
