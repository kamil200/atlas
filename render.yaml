# Render blueprint. Create the workspace, point "New Blueprint" at this repo, and
# everything below is provisioned in one step.
#
# The useful part is that Render wires the pieces itself: DATABASE_URL comes from
# the database it creates, and the two signing secrets are generated server-side,
# so no credential is ever copied by hand or pasted into a terminal.
services:
  - type: web
    name: atlas
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # The API and the built web app are one origin, so /api/health is both the
    # liveness probe and proof the server reached the database layer.
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Injected from the database below rather than typed anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      # Generated by Render. Nobody, including the repo, ever sees these.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Set once, after Render assigns the URL. Used for OAuth redirects.
      - key: FRONTEND_URL
        sync: false

databases:
  - name: atlas-db
    plan: free
    # Postgres 16 to match what the migrations were written and tested against.
    postgresMajorVersion: "16"
