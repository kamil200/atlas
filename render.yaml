# Render blueprint. Create the workspace, point "New Blueprint" at this repo, and
# everything below is provisioned in one step. The README covers what is left to
# do by hand afterwards.
services:
  - type: web
    name: atlas
    runtime: docker
    plan: free
    # The probe has to stay cheap on a sleeping free instance, so /api/health
    # touches no tables. The database is checked once at boot instead.
    healthCheckPath: /api/health
    # A markdown commit cannot change the image, so don't rebuild 779MB for one.
    buildFilter:
      ignoredPaths:
        - "*.md"
        - "**/*.md"
    envVars:
      # Render otherwise routes to port 10000, while the image says 3000.
      - key: PORT
        value: 3000
      # Injected from the database below rather than typed anywhere.
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      # Generated by Render. Nobody, including the repo, ever sees these.
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Set by hand once Render assigns the URL. Until it is, the server falls
      # back to localhost and OAuth sign-ins redirect nowhere useful.
      - key: FRONTEND_URL
        sync: false

databases:
  - name: atlas-db
    plan: free
    # Postgres 16 to match what the migrations were written and tested against.
    postgresMajorVersion: "16"
